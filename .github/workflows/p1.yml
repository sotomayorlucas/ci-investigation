name: p1
on: [pull_request]
permissions: {contents: read}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
  gate_dflt:            # GA1: no status function, need fails -> skipped
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
  gate_iffalse:         # skipped by its own conditional
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
  gate_strict:          # control: fails
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ needs.tests.result != 'success' }}
  ok:                   # control: succeeds
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
